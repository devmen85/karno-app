name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform folders (android/ios)
        run: flutter create . --platforms=android --project-name woocer_app --overwrite

      - name: Debug - list android folder
        run: |
          echo "Contents of repo root:"
          ls -la
          echo "Contents of android/ (if exists):"
          ls -la android/ 2>&1 || echo "android/ does not exist"
          echo "Contents of android/app/ (if exists):"
          ls -la android/app/ 2>&1 || echo "android/app/ does not exist"

      - name: Force Android SDK 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle
          else
            echo "No build.gradle(.kts) found" && exit 1
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: woocer-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
