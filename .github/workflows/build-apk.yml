name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform folders (android) safely
        run: |
          flutter create /tmp/scaffold --platforms=android --project-name woocer_app
          cp -r /tmp/scaffold/android ./android

      - name: Debug - list android folder
        run: |
          echo "Contents of android/app/ (if exists):"
          ls -la android/app/ 2>&1 || echo "android/app/ does not exist"

      - name: Force Android SDK 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle
          else
            echo "No build.gradle(.kts) found" && exit 1
          fi

      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            sed -i '/^dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '/compileOptions {/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
            sed -i '/^dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' android/app/build.gradle
          fi
          echo "--- build.gradle(.kts) after patch ---"
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: woocer-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
